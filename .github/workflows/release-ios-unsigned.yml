name: Build unsigned iOS IPA

on:
  push:
    branches: [main, 'experiment/transparent-widgets-ios18']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_simulator:
        description: Run optional hosted iPhone simulator tests and UI screenshot
        type: boolean
        default: false
      widget_diagnostics:
        description: Include optional photo diagnostics (normal IPA leaves this off)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      WIDGET_PHOTO_DIAGNOSTICS: ${{ inputs.widget_diagnostics && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - name: Test session isolation and native photo rendering
        run: swift test --package-path native/SessionCore
      - name: Test private widget descriptor mutation and fallback
        run: bash scripts/test_widget_descriptor_hook.sh
      - name: Test system Photos crop selector ABI and fallback
        run: bash scripts/test_system_photo_crop.sh
      - name: Setup pinned Flutter
        run: |
          git clone --depth 1 --branch 3.35.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter shell
        run: flutter analyze --fatal-infos
      - name: Test native launch bridge
        run: flutter test
      - name: Enable optional widget diagnostics
        if: inputs.widget_diagnostics
        run: printf '\nSWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited) WIDGET_PHOTO_DIAGNOSTICS\n' >> ios/SessionWidgets/Widget.xcconfig
      - name: Build iPhone application without a certificate
        run: flutter build ios --release --no-codesign
      - name: Compile widget extension for iPhone simulator
        run: |
          xcodebuild -project ios/Runner.xcodeproj -target SessionWidgets \
            -configuration Debug -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/widget-simulator" CODE_SIGNING_ALLOWED=NO \
            > artifacts/widget-simulator-compile.log 2>&1 || {
              tail -n 100 artifacts/widget-simulator-compile.log
              exit 1
            }
          tail -n 8 artifacts/widget-simulator-compile.log
      - name: Compile retained diagnostics and verify their App Intents metadata
        run: |
          xcodebuild -project ios/Runner.xcodeproj -target SessionWidgets \
            -configuration Debug -sdk iphonesimulator \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG WIDGET_PHOTO_DIAGNOSTICS" \
            SYMROOT="$RUNNER_TEMP/widget-diagnostics-simulator" CODE_SIGNING_ALLOWED=NO \
            > artifacts/widget-diagnostics-compile.log 2>&1 || {
              tail -n 100 artifacts/widget-diagnostics-compile.log
              exit 1
            }
          python3 - "$RUNNER_TEMP/widget-diagnostics-simulator" <<'PY'
          import json, pathlib, sys
          path = next(pathlib.Path(sys.argv[1]).rglob('extract.actionsdata'))
          definitions = json.loads(path.read_bytes())
          parameters = {item['name'] for item in definitions['actions']['CameraWidgetConfiguration']['parameters']}
          assert parameters == {'style', 'tapBehavior', 'source', 'intervalMinutes', 'identity', 'photoDiagnostic'}
          modes = next(item for item in definitions['enums'] if item['identifier'] == 'PhotoWidgetDiagnosticMode')
          assert {item['identifier'] for item in modes['cases']} == {'off', 'rendering', 'library', 'request'}
          print('Retained diagnostics compiled and registered; normal IPA verified separately.')
          PY
      - name: Inspect actual iOS 18 private widget runtime
        timeout-minutes: 6
        run: bash scripts/probe_widget_runtime.sh
      - name: Package and validate unsigned IPA
        id: package
        run: bash scripts/package_unsigned_ipa.sh
      - name: Test actual album and folder photo access on iOS 18
        timeout-minutes: 14
        run: bash scripts/test_widget_photos.sh
      - name: Test session lifecycle and photo editing on iPhone simulator
        if: github.event_name == 'workflow_dispatch' && inputs.run_simulator
        timeout-minutes: 15
        run: bash scripts/test_ios_simulator.sh
      - name: Upload native test results and simulator screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: native-verification-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: always() && steps.package.outcome == 'success'
        with:
          name: session-camera-unsigned-${{ github.run_number }}
          path: session-camera-unsigned.ipa
          if-no-files-found: error
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" session-camera-unsigned.ipa \
            --title "借拍 $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
    permissions:
      contents: write
