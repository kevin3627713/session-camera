name: Verify widget Photos integration

on:
  push:
    branches: ['experiment/transparent-widgets-ios18', 'experiment/widget-direct-photos-ios18']
    paths:
      - 'native/WidgetHookTests/PhotoIntegrationApp.swift'
      - 'native/WidgetDiagnostics/**'
      - 'ios/SessionWidgets/PhotoLibrarySource.swift'
      - 'ios/SessionWidgets/SessionWidgets.swift'
      - 'ios/SessionWidgets/WidgetOptions.swift'
      - 'ios/SessionWidgets/SystemPhotoCrop.*'
      - 'ios/SessionWidgets/WidgetPhotoOpenIntent.swift'
      - 'ios/SessionWidgets/PhotoBridgeClient.*'
      - 'ios/Shared/**'
      - 'ios/Runner/SystemPhotosNavigation.swift'
      - 'native/SessionCore/Sources/WidgetCore/**'
      - 'scripts/test_widget_photos.sh'
      - '.github/workflows/widget-photos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-photos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photos:
    strategy:
      fail-fast: false
      matrix:
        diagnostics: ['0', '1']
    env:
      WIDGET_PHOTO_DIAGNOSTICS: ${{ matrix.diagnostics }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test actual album and folder photo access on iOS 18
        timeout-minutes: 16
        run: bash scripts/test_widget_photos.sh
      - name: Upload actual PhotoKit results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: widget-photo-verification-${{ github.run_number }}-diagnostics-${{ matrix.diagnostics }}
          path: artifacts/
          if-no-files-found: ignore
